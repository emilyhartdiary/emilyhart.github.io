name: Refresh Instagram token

# Instagram long-lived tokens last ~60 days and don't renew themselves.
# This refreshes it on the 1st and 15th of every month, well inside that
# window, and stores the new value back as a repo secret.
#
# Requires one extra secret: GH_PAT — a personal access token with
# "repo" scope, used only to update the IG_ACCESS_TOKEN secret.

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if Instagram isn't connected yet
        id: check
        run: |
          if [ -z "${{ secrets.IG_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "IG_ACCESS_TOKEN or GH_PAT not set — nothing to refresh yet. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh long-lived token
        if: steps.check.outputs.skip == 'false'
        id: refresh
        run: |
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.IG_ACCESS_TOKEN }}")
          NEW_TOKEN=$(python3 -c "import sys, json; print(json.loads('''$RESPONSE''')['access_token'])")
          echo "::add-mask::$NEW_TOKEN"
          echo "token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Store new token as a repo secret
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --body "${{ steps.refresh.outputs.token }}" --repo "${{ github.repository }}"
